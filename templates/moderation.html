<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modération</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Fichiers en attente</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <ul>
        {% for fichier in fichiers %}
            <li style="margin-bottom: 30px;">
                <div>
                    <a href="{{ url_for('pending_file', filename=fichier) }}" target="_blank">Voir</a>
                    <strong>{{ fichier }}</strong>
                    <a href="{{ url_for('valider', filename=fichier) }}">Valider</a>
                    <a href="{{ url_for('supprimer', filename=fichier) }}">Supprimer</a>
                </div>

                <!-- Formulaire de renommage/déplacement -->
                <form method="POST" action="{{ url_for('modifier_fichier') }}" style="margin-top: 10px;">
                    <input type="hidden" name="old_filename" value="{{ fichier }}">
                    <label>
                        Nouveau nom (sans .pdf) :
                        <input type="text" name="new_name" required>
                    </label>
                    <label>
                        Nouveau dossier (optionnel) :
                        <input type="text" name="new_folder">
                    </label>
                    <button type="submit">✏️ Renommer / Déplacer</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('logout') }}">Se déconnecter</a>
</body>
</html>
